<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Your Dad? 接爹地的小費</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background-image: url('assets/background.png');
            background-size: cover;
            background-position: center;
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform-origin: center center;   /* 小螢幕時由 JS 等比縮放 */
            flex-shrink: 0;
        }

        /* 頂端爹地頭像（發小費的人） */
        #boss {
            position: absolute;
            top: 40px;
            left: 170px;
            width: 109px;
            height: 130px;
            transition: left 0.1s ease-out, filter 0.25s;
            z-index: 5;
            user-select: none;
            background-image: url('assets/boss1.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        #basket {
            position: absolute;
            top: 540px;      /* 由 JS 控制，可上下左右移動 */
            left: 175px;
            width: 70px;
            height: 40px;
            background: #f1c40f;
            border-radius: 5px 5px 20px 20px;
            box-shadow: inset 0 -5px 0 #d35400;
            cursor: pointer;
            z-index: 10;
        }

        #basket::after {
            content: '💰';
            font-size: 24px;
            position: absolute;
            top: -15px;
            left: 20px;
        }

        /* 掉落物通用樣式 */
        .falling-item {
            position: absolute;
            user-select: none;
            z-index: 8;
        }

        /* 小費樣式 */
        .dollar {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        /* 適尿通藥盒（真實包裝圖） */
        .pill-box {
            width: 76px;
            height: 48px;
            background-image: url('assets/pill.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.45));
        }

        /* 鈔票掉落物 */
        .bill {
            width: 68px;
            height: 29px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.4));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: #ffe600;
            -webkit-text-stroke: 1px #000;
            text-shadow: 0 0 3px #000, 1px 1px 2px #000;
            letter-spacing: -0.5px;
        }

        /* 髮量指示器 */
        #hair-display { color: #f5b041; }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 15;
        }

        #splash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(35deg,
                rgba(133,187,101,0.92) 0px, rgba(133,187,101,0.92) 26px,
                rgba(180,210,160,0.92) 26px, rgba(180,210,160,0.92) 52px);
            z-index: 18;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s;
        }

        #splash::after {
            content: '💸 小鈔糊了你一臉';
            position: absolute;
            top: 45%; left: 0; right: 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1b3a1b;
            text-shadow: 0 1px 2px rgba(255,255,255,0.6);
        }

        #level-screen h2 {
            margin: 0 0 4px;
        }

        .lv-tip {
            color: #95a5a6;
            font-size: 13px;
        }

        #start-screen, #level-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        #game-over-screen, #level-screen {
            display: none;
        }

        #win-video-wrap {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 25;
            cursor: pointer;
        }

        #win-video {
            width: 100%;
            display: block;
        }

        #win-caption {
            position: absolute;
            bottom: 90px; left: 0; right: 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 2px 6px #000;
        }

        #win-play {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            margin: 0;
            padding: 14px 28px;
            font-size: 18px;
            background: rgba(46, 204, 113, 0.92);
            z-index: 2;
        }

        #win-skip {
            position: absolute;
            bottom: 10px; right: 10px;
            margin: 0;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: normal;
            background: rgba(0, 0, 0, 0.55);
            color: #ecf0f1;
            border-radius: 14px;
            box-shadow: none;
            z-index: 2;
        }

        #win-status {
            position: absolute;
            top: 8px; left: 8px; right: 8px;
            font-size: 11px;
            line-height: 1.5;
            color: #7fdba0;
            text-align: left;
            white-space: pre-wrap;
            z-index: 3;
            text-shadow: 0 1px 2px #000;
        }

        #win-skip:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: none;
        }

        #replay-btn {
            display: none;
            background: #8e44ad;
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.4);
            margin-top: 14px;
        }

        #replay-btn:hover {
            background: #7d3c98;
        }

        #restart-btn {
            margin-top: 10px;
        }

        #level-display {
            color: #5dade2;
            line-height: 1.25;
        }

        .lv-name {
            color: #aed6f1;
            font-size: 11px;
            font-weight: normal;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s;
        }

        button:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .instructions {
            font-size: 14px;
            color: #bdc3c7;
            margin-top: 15px;
            line-height: 1.6;
        }

        /* ── Combo 閃字 ── */
        #combo-flash {
            position: absolute;
            top: 38%; left: 0; right: 0;
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            z-index: 30;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        @keyframes comboPop {
            0%   { opacity: 1; transform: scale(1.4); }
            60%  { opacity: 1; transform: scale(1.0); }
            100% { opacity: 0; transform: scale(0.85) translateY(-18px); }
        }
        #combo-flash.pop { animation: comboPop 0.7s ease-out forwards; }

        /* ── 道具：剪刀 / 刮鬍刀 ── */
        .tool {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.5));
        }

        /* ── 補命：爹地人頭代幣 ── */
        .life-item {
            width: 76px; height: 76px;
            background-image: url('assets/life.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 6px #f1c40f) drop-shadow(0 0 12px #f39c12);
            animation: lifeSpin 1.2s linear infinite;
        }
        .life-item::after {
            content: '+1 命';
            position: absolute;
            left: 50%; bottom: -16px;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 900;
            color: #f1c40f;
            white-space: nowrap;
            text-shadow: 0 1px 3px #000, 0 0 6px #000;
        }
        @keyframes lifeSpin {
            0%   { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .life-ico {
            width: 16px; height: 16px;
            vertical-align: middle;
            margin-right: 1px;
        }
        .life-ico.lost { opacity: 0.25; filter: grayscale(1); }

        /* ── 金色鈔票 ── */
        .gold-bill {
            width: 68px; height: 29px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            filter: drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 12px #ff9900);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold; font-family: Arial, sans-serif;
            color: #ffe600; -webkit-text-stroke: 1px #8B6000;
            text-shadow: 0 0 4px #ffd700, 1px 1px 2px #000;
        }

        @keyframes toolShake {
            0%,100% { transform: rotate(-12deg) scale(1.1); }
            25%      { transform: rotate(12deg)  scale(1.2); }
            50%      { transform: rotate(-8deg)  scale(1.1); }
            75%      { transform: rotate(8deg)   scale(1.15); }
        }
        .tool { animation: toolShake 0.3s linear infinite; }

        /* ── 巨型藥盒 ── */
        .mega-pill {
            position: absolute;
            width: 200px;   /* 400 * 1/2 */
            height: 140px;
            background-image: url('assets/pill.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 12;
            filter: drop-shadow(0 0 10px #e74c3c) drop-shadow(0 0 20px #c0392b);
        }
        @keyframes megaWarn {
            0%,100% { filter: drop-shadow(0 0 10px #e74c3c) drop-shadow(0 0 20px #c0392b); }
            50%      { filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 40px #ff6600) brightness(1.2); }
        }
        .mega-pill { animation: megaWarn 0.6s ease-in-out infinite; }

        /* ── 接到東西時的飄字 ── */
        .pop-text {
            position: absolute;
            font-weight: 900;
            font-size: 16px;
            pointer-events: none;
            z-index: 28;
            white-space: nowrap;
            text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,0.6);
            animation: popUp 0.8s ease-out forwards;
        }
        @keyframes popUp {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-44px) scale(1.15); }
        }

        /* ── 成就提示 ── */
        #toast {
            position: absolute;
            top: 64px; left: 50%;
            transform: translateX(-50%) translateY(-10px);
            padding: 6px 14px;
            background: rgba(0,0,0,0.8);
            border: 1px solid #f1c40f;
            border-radius: 16px;
            color: #f1c40f;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            z-index: 32;
            transition: opacity 0.25s, transform 0.25s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ── 角落小按鈕：音效 / 下班 ── */
        .corner-btn {
            position: absolute;
            bottom: 6px;
            margin: 0;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: normal;
            background: rgba(0,0,0,0.55);
            color: #ecf0f1;
            border-radius: 12px;
            box-shadow: none;
            z-index: 16;
        }
        .corner-btn:hover { background: rgba(0,0,0,0.85); transform: none; }
        #mute-btn     { left: 6px; }
        #clockout-btn { right: 6px; display: none; background: rgba(192,57,43,0.8); }

        /* ── 次要按鈕 ── */
        .small-btn {
            padding: 8px 18px;
            font-size: 14px;
            margin-top: 10px;
            background: #34495e;
            box-shadow: none;
        }
        .small-btn:hover { background: #4a6278; }
        .endless-btn { background: #8e44ad; box-shadow: 0 4px 15px rgba(142,68,173,0.4); }
        .endless-btn:hover { background: #7d3c98; }

        /* ── 排行榜 ── */
        .board {
            margin: 8px 0 0;
            font-size: 12px;
            color: #bdc3c7;
            line-height: 1.5;
            min-width: 200px;
        }
        .board .b-title { color: #f1c40f; font-weight: bold; margin-bottom: 2px; }
        .board .b-row { display: flex; justify-content: space-between; gap: 12px; }
        .board .b-row.me { color: #2ecc71; font-weight: bold; }
        .board .b-empty { color: #7f8c8d; font-style: italic; }

        /* ── 上榜輸入名字 ── */
        #name-entry {
            margin-top: 10px;
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        #name-entry input {
            width: 72px;
            padding: 6px 8px;
            font-size: 15px;
            text-align: center;
            border: 2px solid #f1c40f;
            border-radius: 8px;
            background: #1b1b1b;
            color: #fff;
            font-family: inherit;
        }
        #name-entry button { margin: 0; padding: 6px 12px; font-size: 13px; }

        /* ── 成就畫面 ── */
        #ach-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 22;
            padding: 10px 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #ach-screen h2 { margin: 0 0 6px; font-size: 18px; }
        .ach-list { width: 100%; display: flex; flex-direction: column; gap: 3px; }
        .ach-item {
            display: flex; align-items: center; gap: 10px;
            padding: 3px 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            text-align: left;
        }
        .ach-item.locked { opacity: 0.45; filter: grayscale(1); }
        .ach-icon { font-size: 22px; width: 28px; text-align: center; }
        .ach-name { font-size: 13px; font-weight: bold; color: #f1c40f; }
        .ach-desc { font-size: 11px; color: #bdc3c7; }
        .ach-item.locked .ach-name { color: #95a5a6; }

        #run-ach { margin-top: 6px; font-size: 22px; letter-spacing: 4px; }
        .height-hint { color: #5dade2; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI 資訊 -->
        <div id="ui">
            <div id="level-display">第 1 關<br><span class="lv-name">隨手給幾張</span></div>
            <div id="score-display">$0 / $300</div>
            <div id="hair-display">髮量 1/9</div>
            <div id="time-display">30s</div>
        </div>

        <!-- Combo 閃字 -->
        <div id="combo-flash"></div>

        <!-- 小鈔遮擋層 -->
        <div id="splash"></div>

        <!-- 爹地頭像 -->
        <div id="boss"></div>

        <!-- 遊戲碗/錢包 -->
        <div id="basket"></div>

        <!-- 成就提示 -->
        <div id="toast"></div>

        <!-- 角落按鈕 -->
        <button id="mute-btn" class="corner-btn">🔊 音效</button>
        <button id="clockout-btn" class="corner-btn">🏁 下班結算</button>

        <!-- 開始畫面 -->
        <div id="start-screen">
            <h2 style="margin:0 0 2px">Who's Your Dad?</h2>
            <p style="margin:0 0 6px;color:#f1c40f;font-size:15px">接住爹地灑下來的小費</p>
            <p class="instructions" style="margin-top:6px">
                三個關卡，每關都要達到業績目標才能晉級<br>
                💵 $10 | 💵 $50 | 💵 $100<br>
                <span style="color:#5dade2">🎮 滑鼠 / 方向鍵 / WASD / 手指　上下左右都能動</span><br>
                <span class="height-hint">🚀 錢包越高，接到的錢加成越多（最高 ×1.5）</span><br>
                <span style="color: #ffeb3b; font-weight: bold;">⚠️ 接到「適尿通」扣 50，爹地頭髮 +1</span><br>
                <span style="color: #f1c40f; font-weight: bold;"><img class="life-ico" src="assets/life.png" alt=""> 開局三命、最多五命，三關共用；沒達標或髮量爆表扣一命，接到爹地人頭補一命</span><br>
                <span style="color: #e74c3c; font-weight: bold;">☠️ 命用完 → 結束</span>
            </p>
            <button id="start-btn" style="margin-top:8px">開始發小費</button>
            <button id="start-endless-btn" class="small-btn endless-btn" style="display:none">🌙 加班模式（無盡）</button>
            <button id="ach-btn" class="small-btn">🏆 成就 0/12</button>
            <div id="start-board" class="board"></div>
        </div>

        <!-- 成就畫面 -->
        <div id="ach-screen">
            <h2>🏆 成就</h2>
            <div id="ach-list" class="ach-list"></div>
            <button id="ach-close" class="small-btn">返回</button>
        </div>

        <!-- 關卡畫面（開場／過關／失敗共用） -->
        <div id="level-screen">
            <h2 id="level-title">關卡一 · 試用期</h2>
            <p id="level-body" class="instructions"></p>
            <button id="level-btn">開工</button>
        </div>

        <!-- 三關全過的慶祝影片 -->
        <div id="win-video-wrap">
            <video id="win-video" playsinline muted preload="auto" src="assets/win.mp4"></video>
            <div id="win-caption">爹地：拿去用吧</div>
            <button id="win-play">▶ 播放</button>
            <button id="win-skip">跳過</button>
            <div id="win-status"></div>
        </div>

        <!-- 結束畫面 -->
        <div id="game-over-screen">
            <h2>遊戲結束！</h2>
            <p id="final-score" style="font-size: 24px; color: #f1c40f; margin: 6px 0"></p>
            <div id="run-ach" title="本場解鎖的成就"></div>
            <div id="name-entry">
                <span style="color:#f1c40f">🏅 上榜了！留個名：</span>
                <input id="name-input" maxlength="4" placeholder="名字">
                <button id="name-ok">登錄</button>
            </div>
            <div id="over-board" class="board"></div>
            <button id="over-endless-btn" class="small-btn endless-btn" style="display:none">🌙 繼續加班（無盡模式）</button>
            <button id="replay-btn" class="small-btn">🎬 看一次爹地的英姿</button>
            <button id="restart-btn" style="margin-top:10px">再挑戰一次</button>
        </div>
    </div>

    <script>
        const BOSS_FACES = [
            'assets/boss1.png',
            'assets/boss2.png',
            'assets/boss3.png',
            'assets/boss4.png',
            'assets/boss5.png',
            'assets/boss6.png',
            'assets/boss7.png',
            'assets/boss8.png',
            'assets/boss9.png'
        ];
        const BILLS = {
            '1': 'assets/bill1.png',
            '2': 'assets/bill2.png',
            '5': 'assets/bill5.png',
            '10': 'assets/bill10.png',
            '20': 'assets/bill20.png',
            '50': 'assets/bill50.png',
            '100': 'assets/bill100.png'
        };

        // ===== 關卡設定 =====
        const LEVELS = [
            { name: '關卡一 · 隨手給幾張', time: 28, target: 390,
              pill: 0.20, spawn: 290, bossMove: 300, speedBase: 3,
              drift: 0,   speedMul: 1.0, junk: false, gold: 0,    tool: 0.04,
              tip: '全部垂直落下，穩穩接就好' },
            { name: '關卡二 · 爹地心情好', time: 27, target: 910,
              pill: 0.27, spawn: 300, bossMove: 270, speedBase: 2.8,
              drift: 1.8, speedMul: 0.7, junk: false, gold: 0.04, tool: 0.05,
              tip: '連擊越高，藥盒越多越快，小心別斷' },
            { name: '關卡三 · 天女散花', time: 25, target: 1200,
              pill: 0.30, spawn: 270, bossMove: 250, speedBase: 2.9,
              drift: 2.2, speedMul: 0.74, junk: true, gold: 0.07, tool: 0.06,
              tip: '連擊拉越高，藥盒就越瘋，背水一戰' }
        ];
        // 播放結尾影片的關卡（最後一關）。測試時可暫時改成 0 = 第一關就播
        const WIN_AFTER_LEVEL = LEVELS.length - 1;


        const JUNK = [
            { bill: '1',  value: 1  },
            { bill: '2',  value: 2  },

            if (!audioCtx) {

        function tone(freq, dur, type, vol, slideTo, delay) {
            if (muted || !audioCtx) return;
            const t0 = audioCtx.currentTime + (delay || 0);
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = type || 'square';
            o.frequency.setValueAtTime(freq, t0);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            g.gain.setValueAtTime(vol || 0.15, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            o.connect(g).connect(audioCtx.destination);
            o.start(t0); o.stop(t0 + dur + 0.02);
        }

                    // 三關全過：解鎖加班模式與相關成就，再播影片
                    save('wyd_endless', true);
                    renderEndlessUnlock();
                    unlock('clear');
                    if (hairLevel <= 2) unlock('hairy');
                    if (hairLevel >= 8) unlock('bald');
                    if (bank >= 10000) unlock('rich');
                    playWinVideo();
                    return;
                }
                levelIdx++;
                levelTitle.innerText = '✅ 過關！';
                levelBody.innerHTML =
                    `這關賺了 <span style="color:#2ecc71">${fmtMoney(score)}</span>　` +
                    `累積 <span style="color:#2ecc71">${fmtMoney(bank)}</span><br>` +
                    `髮量 <span style="color:#f5b041">${hairLevel + 1}/9</span>　` +
                    `下一關：${LEVELS[levelIdx].name}`;
                levelBtn.innerText = '繼續';
                levelScreen.style.display = 'flex';
            } else {
                // 沒達標：扣一命；沒命了就結束
                lives--; lostLifeThisRun = true; renderLives();
                if (lives <= 0) { finish('broke'); return; }
                sfx.fail();
                levelTitle.innerText = '❌ 爹地收手了';
                levelBody.innerHTML =
                    `只收到 <span style="color:#e74c3c">${fmtMoney(score)}</span>，` +
                    `差 <span style="color:#e74c3c">${fmtMoney(lv.target - score)}</span><br>` +
                    `用掉一命 → 剩 ${livesHtml()}<br>` +
                    `<span class="lv-tip">本關分數歸零重來，但髮量不會還你</span><br>` +
                    `目前髮量 <span style="color:#f5b041">${hairLevel + 1}/9</span>`;
                levelBtn.innerText = '再來一次';
                levelScreen.style.display = 'flex';
            }
        }

        // 藥盒過量：有命就急救（扣一命、髮量回 5/9），沒命就結束。
        // 回傳 true 代表遊戲繼續進行（只有加班模式會在原地繼續）
        function overdoseHit() {
            if (lives <= 0) { finish('overdose'); return false; }
            lives--; lostLifeThisRun = true;
            setHair(RESCUE_HAIR);
            sfx.fail();
            if (endless) {
                popText(basketX - 30, basketY - 40, `急救！-1命　髮量回 ${RESCUE_HAIR + 1}/9`, '#e74c3c');
                toast(`☠️ 適尿通過量，用掉一命，剩 ${lives} 命`);
                return true;
            }
            stopLevel();
            levelTitle.innerText = '☠️ 適尿通過量！';
            levelBody.innerHTML =
                `髮量爆表還硬吃一盒，送醫急救<br>` +
                `用掉一命 → 剩 ${livesHtml()}<br>` +
                `<span class="lv-tip">髮量洗回 <span style="color:#f5b041">${RESCUE_HAIR + 1}/9</span>，本關分數歸零重來</span>`;
            levelBtn.innerText = '再來一次';
            levelScreen.style.display = 'flex';
            return false;
        }

        // 整場結束：reason = 'clear'（三關全過）| 'overdose'（藥盒過量且沒命）| 'broke'（沒達標且沒命）| 'clockout'（加班主動下班）
        let pendingEntry = null;   // 等待輸入名字的排行榜資料
        const nameEntry = document.getElementById('name-entry');
        const nameInput = document.getElementById('name-input');

        function finish(reason) {
            stopLevel();
            const h2 = gameOverScreen.querySelector('h2');
            const total = bank + (reason === 'clear' ? 0 : score);
            const mode = endless ? 'endless' : 'story';
            if (total >= 10000) unlock('rich');

            if (endless) {
                h2.innerText = reason === 'overdose' ? '☠️ 加班到倒下' : '🏁 準時下班';
                const wave = endlessWave();
                const verdict = elapsed < 30  ? '這樣也算加班？'
                              : elapsed < 60  ? '有加到，但老闆沒看到'
                              : elapsed < 120 ? '爹地開始記得你的名字了'
                              : '爹地把公司股票分你一張';
                finalScore.innerHTML =
                    `撐了 <span style="color:#8e44ad">${elapsed} 秒</span>　第 ${wave} 波<br>` +
                    `加班費 <span style="color:#f1c40f">${fmtMoney(total)}</span>　髮量 ${hairLevel + 1}/9<br>` +
                    `<span style="font-size:15px;color:#bdc3c7">${verdict}</span>`;
                finalScore.style.color = '#f1c40f';
                if (reason === 'overdose') sfx.fail(); else sfx.clear();
            } else if (reason === 'overdose') {
                h2.innerText = '☠️ 適尿通過量！';
                finalScore.innerHTML =
                    `三條命都用完，最後一盒直接送走<br>` +
                    `倒在第 ${levelIdx + 1} 關，結算 ${fmtMoney(total)}`;
                finalScore.style.color = '#e74c3c';
                sfx.fail();
            } else if (reason === 'broke') {
                h2.innerText = '💸 三命用盡';
                finalScore.innerHTML =
                    `第 ${levelIdx + 1} 關業績一直沒達標<br>` +
                    `爹地不再給機會，結算 ${fmtMoney(total)}`;
                finalScore.style.color = '#e74c3c';
                sfx.fail();
            } else {
                if (!lostLifeThisRun) unlock('fullhp');
                const rank = hairLevel <= 2 ? '精算師 —— 錢賺了，頭髮也顧住了'
                           : hairLevel <= 5 ? '普通上班族 —— 有得有失'
                           : hairLevel <= 7 ? '拚命三郎 —— 這錢賺得有點傷'
                           : '以健康換錢 —— 爹地很滿意，你的頭皮不滿意';
                h2.innerText = '🎉 三關全過！';
                finalScore.innerHTML =
                    `總小費 <span style="color:#f1c40f">${fmtMoney(total)}</span><br>` +
                    `最終髮量 ${hairLevel + 1}/9<br>` +
                    `<span style="font-size:17px;color:#bdc3c7">${rank}</span>`;
                finalScore.style.color = '#f1c40f';
            }

            // 本場解鎖的成就
            const runAchEl = document.getElementById('run-ach');
            runAchEl.innerText = runAch.length ? runAch.map(a => a.icon).join('') : '';
            runAchEl.title = runAch.map(a => a.name).join('、');

            // 排行榜：上榜就請玩家留名，否則直接顯示
            pendingEntry = null;
            if (qualifies(mode, total)) {
                pendingEntry = { mode, entry: { name: '', score: total, hair: hairLevel + 1, sec: elapsed } };
                nameInput.value = load('wyd_name', '');
                nameEntry.style.display = 'flex';
                overBoard.innerHTML = '';
                setTimeout(() => nameInput.focus(), 50);
            } else {
                nameEntry.style.display = 'none';
                renderBoard(overBoard, mode, -1);
            }

            replayBtn.style.display      = (!endless && reason === 'clear') ? 'block' : 'none';
            overEndlessBtn.style.display = (!endless && reason === 'clear') ? 'block' : 'none';
            gameOverScreen.style.display = 'flex';
        }

        function submitName() {
            if (!pendingEntry) return;
            const name = (nameInput.value.trim() || '路人').slice(0, 4);
            save('wyd_name', name);
            pendingEntry.entry.name = name;
            const idx = addScore(pendingEntry.mode, pendingEntry.entry);
            renderBoard(overBoard, pendingEntry.mode, idx);
            renderBoard(startBoard, 'story', -1);
            nameEntry.style.display = 'none';
            pendingEntry = null;
            sfx.gold();
        }
        document.getElementById('name-ok').addEventListener('click', submitName);
        nameInput.addEventListener('keydown', (e) => {
            e.stopPropagation();          // 別讓 WASD 被當成移動鍵
            if (e.key === 'Enter') submitName();
        });

        // ===== 三關全過的慶祝影片 =====
        const winPlayBtn = document.getElementById('win-play');
        const winSkipBtn = document.getElementById('win-skip');
        const winStatus  = document.getElementById('win-status');

        function playWinVideo(after) {
            let done = false;
            let watchdog = null;
            let log = '';

            const say = (msg, show) => {
                log += msg + '\n';
                if (show) winStatus.innerText = log;   // 只有出錯才顯示在畫面上
                console.log('[win-video]', msg);
            };

            // 只有「播完」「玩家按跳過」才會離開，其餘狀況一律留在畫面上
            const goNext = (why) => {
                if (done) return;
                done = true;
                clearTimeout(watchdog);
                try { winVideo.pause(); } catch (e) {}
                winWrap.style.display = 'none';
                winPlayBtn.style.display = 'none';
                winStatus.innerText = '';
                (after || (() => finish('clear')))();
            };

            const fail = (why) => {                 // 出錯：不跳過，顯示原因等玩家處理
                say('✖ ' + why, true);
                winPlayBtn.style.display = 'block';
                clearTimeout(watchdog);
            };

            const armWatchdog = () => {
                clearTimeout(watchdog);
                const dur = isFinite(winVideo.duration) && winVideo.duration > 0
                          ? winVideo.duration : 3;
                watchdog = setTimeout(() => goNext('逾時'), (dur + 3) * 1000);
            };

            winStatus.innerText = '';
            winWrap.style.display = 'flex';
            winPlayBtn.style.display = 'none';
            winWrap.onclick = null;
            winSkipBtn.onclick = (e) => { e.stopPropagation(); goNext('跳過'); };
            winPlayBtn.onclick = (e) => {
                e.stopPropagation();
                winPlayBtn.style.display = 'none';
                say('手動播放…');
                winVideo.play().then(() => { say('✔ 播放中'); armWatchdog(); })
                               .catch((er) => fail('手動播放失敗 ' + (er && er.name)));
            };

            winVideo.onended = () => goNext('播完');
            winVideo.onerror = () => {
                const c = winVideo.error ? winVideo.error.code : '?';
                fail('影片載入錯誤 code=' + c);
            };
            winVideo.onstalled = () => say('· stalled');
            winVideo.onloadeddata = () => say('· loadeddata ok');

            winVideo.muted = true;
            winVideo.playsInline = true;
            winVideo.controls = false;


            const start = () => {
                if (done) return;
                say('· readyState=' + winVideo.readyState);
                try { winVideo.currentTime = 0; } catch (e) {}
                const pr = winVideo.play();
                if (pr && pr.then) {
                    pr.then(() => { say('✔ 自動播放成功'); armWatchdog(); })
                      .catch((e) => {
                          say('自動播放被拒 ' + (e && e.name) + '，請按播放');
                          winPlayBtn.style.display = 'block';
                      });
                } else { armWatchdog(); }
            };

            if (winVideo.readyState >= 2) {
                start();
            } else {
                winVideo.addEventListener('loadeddata', start, { once: true });
                winVideo.load();
                setTimeout(() => {
                    if (!done && winVideo.paused && winPlayBtn.style.display === 'none') {
                        say('· 1.5s 後仍未就緒，強制嘗試');
                        start();
                    }
                }, 1500);
            }
        }

        // ===== 小鈔遮擋 =====
        function showSplash() {
            splash.style.opacity = '1';
            clearTimeout(splashTimer);
            splashTimer = setTimeout(hideSplash, 900);
        }
        function hideSplash() {
            clearTimeout(splashTimer);
            splash.style.opacity = '0';
        }

        // ===== 掉落物 =====

        // ── 巨型藥盒（橫掃式）──
        let megaCooldown = false;   // 同時只允許一顆

        // 解除冷卻並清掉殘留的計時器，避免舊 timeout 跨關把新關的冷卻提早解開
        function resetMega() {
            clearTimeout(megaTimer);
            megaCooldown = false;
        }
        function megaCooldownFor(ms) {
            clearTimeout(megaTimer);
            megaTimer = setTimeout(() => { megaCooldown = false; }, ms);
        }

        function spawnMegaPill() {
            if (!isPlaying || megaCooldown) return;
            megaCooldown = true;

            const lv     = curLv();
            const pw     = 200;                    // 藥盒寬度（容器 1/2）
            sfx.mega();
            // 隨機水平位置：左邊最多從 0 開始，右邊最多讓右緣貼齊容器
            const startX = Math.random() * (containerWidth - pw);
            let topPos   = 120;  // 從爹地正下方開始往下掉
            // 速度比一般藥盒慢（壓迫感，但還有機會閃）
            const speed  = lv.speedBase * lv.speedMul * 0.65;
            // 左右搖擺幅度依關卡設定（與一般掉落物一致）
            let megaX   = startX;
            let megaDrift = lv.drift > 0
                ? (Math.random() < 0.5 ? -1 : 1) * lv.drift * 0.8
                : 0;

            const item = document.createElement('div');
            item.classList.add('falling-item', 'mega-pill');   // 帶 falling-item 才會被 clearItems 清掉
            item.style.top  = topPos + 'px';
            item.style.left = megaX + 'px';
            container.appendChild(item);

            function sweep() {
                if (!isPlaying) { item.remove(); megaCooldown = false; return; }
                topPos += speed;
                item.style.top = topPos + 'px';
                // 左右搖擺，碰牆反彈
                if (megaDrift !== 0) {
                    megaX += megaDrift;
                    if (megaX < 0) { megaX = 0; megaDrift = -megaDrift; }
                    else if (megaX + pw > containerWidth) { megaX = containerWidth - pw; megaDrift = -megaDrift; }
                    item.style.left = megaX + 'px';
                }

                // 碰撞偵測
                const b = basket.getBoundingClientRect();
                const r = item.getBoundingClientRect();
                if (r.bottom >= b.top && r.top <= b.bottom &&
                    r.right  >= b.left && r.left <= b.right) {
                    // 命中：扣分 + combo歸零 + 髮量 +2
                    score -= 50;
                    pillsThisLevel++;
                    if (combo >= 3) popText(basketX - 10, basketY - 40, `連擊 ×${combo} 斷了`, '#e74c3c');
                    resetCombo();
                    sfx.pill();
                    if (hairLevel >= 8) {
                        // 髮量已是 9/9 → 過量，交給 overdoseHit 決定急救或結束
                        updateScore();
                        item.remove();
                        if (overdoseHit()) megaCooldownFor(4000);
                        return;
                    }
                    setHair(Math.min(hairLevel + 2, 8));
                    popText(basketX, basketY - 20, '-$50  髮量+2', '#e74c3c');
                    updateScore();
                    item.remove();
                    megaCooldownFor(4000);   // 命中後冷卻 4 秒
                    return;
                }

                // 離開畫面（底部）：算躲過一顆
                if (topPos > 620) {
                    item.remove();
                    dodgesThisRun++;
                    if (dodgesThisRun >= 5) unlock('dodge5');
                    megaCooldownFor(1500);
                    return;
                }
                requestAnimationFrame(sweep);
            }
            requestAnimationFrame(sweep);
        }

        function spawnItem() {
            if (!isPlaying) return;
            // 巨型藥盒：故事模式在分數達到當關目標 50% 後 8%；加班模式 15 秒後 6%
            const megaReady = endless ? elapsed >= 30 : score >= LEVELS[levelIdx].target * 0.5;
            if (!megaCooldown && megaReady && Math.random() < (endless ? 0.04 : 0.08)) {
                spawnMegaPill(); return;
            }

            const lv = curLv();
            const item = document.createElement('div');
            item.classList.add('falling-item');

            const rand = Math.random();
            let type, value = 0;
            let speed = (Math.random() * 3 + lv.speedBase) * lv.speedMul;

            // 機率累加：藥盒 → 道具 → 金色鈔票 → 干擾小鈔 → 一般鈔票
            // 藥盒機率和速度隨連擊等比增加
            const comboPillMul = 1 + combo * 0.08;
            const comboPillSpd = combo * 0.3;
            const p_pill = Math.min(lv.pill * comboPillMul, 0.65);  // 最高 65%
            // 每關最多掉 LIFE_PER_LEVEL 個；命滿也照掉，接到改給獎金
            const canLife = lifeSpawnedThisLevel < LIFE_PER_LEVEL;
            const p_life = p_pill + (canLife ? LIFE_CHANCE : 0);
            const p_tool = p_life + lv.tool;
            const p_gold = p_tool + lv.gold;
            const p_junk = p_gold + (lv.junk ? 0.25 : 0);

            if (rand < p_pill) {
                item.classList.add('pill-box');
                type = 'pill';
                speed += 1 + comboPillSpd;

            } else if (rand < p_life) {
                // 補一命：爹地人頭代幣
                item.classList.add('life-item');
                type = 'life';
                lifeSpawnedThisLevel++;
                speed = Math.max(1.5, speed * 0.5);   // 全場最慢，讓玩家看清楚照片

            } else if (rand < p_tool) {
                // 剪刀 70%：髮量 -1；刮鬍刀 30%：髮量 -2，掉得更快
                const isRazor = Math.random() < 0.3;
                item.classList.add('tool');
                item.innerText = isRazor ? '🪒' : '✂️';
                type = isRazor ? 'razor' : 'scissors';
                speed += isRazor ? 8 : 6;     // 非常快，比金鈔還快，要刻意搶

            } else if (rand < p_gold) {
                // 金色鈔票 $500
                item.classList.add('gold-bill');
                item.style.backgroundImage = `url('${BILLS['100']}')`;
                item.innerText = '💰$500';
                type = 'gold';
                value = 500;
                speed += 5;     // 快

            } else if (lv.junk && rand < p_junk) {
                const j = JUNK[Math.floor(Math.random() * JUNK.length)];
                item.classList.add('bill');
                item.style.backgroundImage = `url('${BILLS[j.bill]}')`;
                item.innerText = '$' + j.bill;
                type = 'junk';
                value = j.value;

            } else {
                const r2 = (rand - p_junk) / (1 - p_junk) || Math.random();
                let amt;
                if (r2 < 0.55)      { amt = '10';  }
                else if (r2 < 0.85) { amt = '50';  speed += 1; }
                else                { amt = '100'; speed += 3; }
                item.classList.add('bill');
                item.style.backgroundImage = `url('${BILLS[amt]}')`;
                item.innerText = '$' + amt;
                type = amt;
                value = parseInt(amt, 10);
            }

            const bossLeft = parseFloat(boss.style.left) || 170;
            item.style.left = (bossLeft + bossWidth / 2 - 15) + 'px';
            item.style.top = '125px';
            container.appendChild(item);

            let topPos = 125;
            // 斜線：關卡一為 0（垂直），二、三所有掉落物都會斜著走
            let drift = 0;
            if (lv.drift > 0) {
                // 避開接近垂直的角度，斜線才看得出來
                const dir = Math.random() < 0.5 ? -1 : 1;
                drift = dir * (lv.drift * (0.45 + Math.random() * 0.55));
            }
            let x = parseFloat(item.style.left);

            function fall() {
                if (!isPlaying) { item.remove(); return; }
                topPos += speed;
                item.style.top = topPos + 'px';
                if (drift) {
                    x += drift;
                    const w = item.offsetWidth || 68;
                    if (x < 0) { x = 0; drift = -drift; }               // 撞左牆反彈
                    else if (x > containerWidth - w) { x = containerWidth - w; drift = -drift; }
                    item.style.left = x + 'px';
                }

                const b = basket.getBoundingClientRect();
                const r = item.getBoundingClientRect();
                if (r.bottom >= b.top && r.top <= b.bottom &&
                    r.right >= b.left && r.left <= b.right) {
                    const px = basketX, py = basketY - 22;   // 飄字位置
                    if (type === 'pill') {
                        score -= 50;
                        pillsThisLevel++;
                        if (combo >= 3) popText(px - 10, py - 18, `連擊 ×${combo} 斷了`, '#e74c3c');
                        resetCombo();
                        sfx.pill();
                        if (hairLevel >= 8) {
                            updateScore();
                            item.remove();
                            overdoseHit();
                            return;
                        }
                        setHair(hairLevel + 1);
                        popText(px, py, '-$50', '#e74c3c');

                    } else if (type === 'life') {
                        if (lives < MAX_LIVES) { lives++; renderLives(); popText(px, py, '+1 命！', '#f1c40f'); }
                        else { score += LIFE_FULL_BONUS; popText(px, py, `命已滿 +$${LIFE_FULL_BONUS}`, '#f1c40f'); }
                        sfx.gold();
                        // 不影響連擊

                    } else if (type === 'scissors' || type === 'razor') {
                        // 剪刀：髮量 -1；刮鬍刀：髮量 -2（最低 0）
                        const cut = type === 'razor' ? 2 : 1;
                        if (hairLevel > 0) {
                            const actual = Math.min(cut, hairLevel);
                            setHair(hairLevel - actual);
                            popText(px, py, `髮量 -${actual}`, type === 'razor' ? '#9b59b6' : '#5dade2');
                        } else popText(px, py, '已經很茂密了', '#95a5a6');
                        sfx.tool();
                        // 道具不加分、不算連擊、不中斷連擊

                    } else if (type === 'junk') {
                        score += value;
                        if (combo >= 3) popText(px - 10, py - 18, `連擊 ×${combo} 斷了`, '#e74c3c');
                        resetCombo();   // 小鈔中斷連擊
                        showSplash();
                        sfx.junk();
                        popText(px, py, `+$${value}`, '#95a5a6');

                    } else {
                        // 一般鈔票與金鈔：連擊倍率 × 高空加成
                        const mul = comboMultiplier();
                        const hb  = heightBonus();
                        const gain = Math.round(value * mul * hb);
                        score += gain;
                        addCombo();
                        const high = hb >= 1.15;
                        popText(px, py, `+$${gain}${high ? ' ↑' : ''}`,
                                type === 'gold' ? '#ffd700' : high ? '#5dade2' : '#2ecc71');
                        if (type === 'gold') {
                            sfx.gold();
                            goldThisRun++;
                            if (goldThisRun >= 5) unlock('gold5');
                        } else {
                            sfx.bill(value);
                        }
                        if (value >= 100 && basketY <= BASKET_MIN_Y + 10) unlock('high100');
                    }
                    updateScore();
                    item.remove();
                    return;
                }

                if (topPos > 600) {
                    if (type !== 'pill' && type !== 'scissors' && type !== 'razor' && type !== 'life') {
                        if (combo >= 3) popText(x, 560, `連擊 ×${combo} 斷了`, '#e74c3c');
                        resetCombo();
                    }
                    item.remove();
                }
                else requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        // ===== 按鈕 =====
        function resetRun() {
            levelIdx = 0; bank = 0; score = 0; hairLevel = 0; elapsed = 0;
            runAch = []; goldThisRun = 0; dodgesThisRun = 0; pillsThisLevel = 0;
            lives = START_LIVES; lostLifeThisRun = false;
        }
        function newGame() {
            ensureAudio();
            endless = false;
            resetRun();
            showLevelIntro();
        }
        // 從開始畫面進加班：全新一場，髮量 0
        function newEndless() {
            ensureAudio();
            endless = true;
            resetRun();
            startScreen.style.display = 'none';
            startLevel();
        }
        // 三關全過後繼續加班：髮量沿用，加班費另計
        function continueEndless() {
            ensureAudio();
            endless = true;
            bank = 0; score = 0; elapsed = 0;
            gameOverScreen.style.display = 'none';
            startLevel();
        }
        startBtn.addEventListener('click', newGame);
        restartBtn.addEventListener('click', newGame);
        startEndlessBtn.addEventListener('click', newEndless);
        overEndlessBtn.addEventListener('click', continueEndless);
        clockoutBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (endless && isPlaying) finish('clockout');
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && endless && isPlaying) finish('clockout');
        });
        replayBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            playWinVideo(() => { gameOverScreen.style.display = 'flex'; });
        });
        levelBtn.addEventListener('click', startLevel);
    </script>
</body>
</html>
