<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Your Dad? 接爹地的小費</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #2c3e50;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background-image: url('assets/background.png');
            background-size: cover;
            background-position: center;
            border: 4px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 頂端爹地頭像（發小費的人） */
        #boss {
            position: absolute;
            top: 40px;
            left: 170px;
            width: 109px;
            height: 130px;
            transition: left 0.1s ease-out, filter 0.25s;
            z-index: 5;
            transition: left 0.1s ease-out;
            user-select: none;
            background-image: url('assets/boss1.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        #basket {
            position: absolute;
            bottom: 20px;
            left: 175px;
            width: 70px;
            height: 40px;
            background: #f1c40f;
            border-radius: 5px 5px 20px 20px;
            box-shadow: inset 0 -5px 0 #d35400;
            cursor: pointer;
            z-index: 10;
        }

        #basket::after {
            content: '💰';
            font-size: 24px;
            position: absolute;
            top: -15px;
            left: 20px;
        }

        /* 掉落物通用樣式 */
        .falling-item {
            position: absolute;
            user-select: none;
            z-index: 8;
        }

        /* 小費樣式 */
        .dollar {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        /* 適尿通藥盒（真實包裝圖） */
        .pill-box {
            width: 76px;
            height: 48px;
            background-image: url('assets/pill.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.45));
        }

        /* 鈔票掉落物 */
        .bill {
            width: 68px;
            height: 29px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.4));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            color: #ffe600;
            -webkit-text-stroke: 1px #000;
            text-shadow: 0 0 3px #000, 1px 1px 2px #000;
            letter-spacing: -0.5px;
        }

        /* 髮量指示器 */
        #hair-display { color: #f5b041; }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 15;
        }

        #splash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(35deg,
                rgba(133,187,101,0.92) 0px, rgba(133,187,101,0.92) 26px,
                rgba(180,210,160,0.92) 26px, rgba(180,210,160,0.92) 52px);
            z-index: 18;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s;
        }

        #splash::after {
            content: '💸 小鈔糊了你一臉';
            position: absolute;
            top: 45%; left: 0; right: 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #1b3a1b;
            text-shadow: 0 1px 2px rgba(255,255,255,0.6);
        }

        #level-screen h2 {
            margin: 0 0 4px;
        }

        .lv-tip {
            color: #95a5a6;
            font-size: 13px;
        }

        #start-screen, #level-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        #game-over-screen, #level-screen {
            display: none;
        }

        #win-video-wrap {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 25;
            cursor: pointer;
        }

        #win-video {
            width: 100%;
            display: block;
        }

        #win-caption {
            position: absolute;
            bottom: 90px; left: 0; right: 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 2px 6px #000;
        }

        #win-play {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            margin: 0;
            padding: 14px 28px;
            font-size: 18px;
            background: rgba(46, 204, 113, 0.92);
            z-index: 2;
        }

        #win-skip {
            position: absolute;
            bottom: 10px; right: 10px;
            margin: 0;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: normal;
            background: rgba(0, 0, 0, 0.55);
            color: #ecf0f1;
            border-radius: 14px;
            box-shadow: none;
            z-index: 2;
        }

        #win-status {
            position: absolute;
            top: 8px; left: 8px; right: 8px;
            font-size: 11px;
            line-height: 1.5;
            color: #7fdba0;
            text-align: left;
            white-space: pre-wrap;
            z-index: 3;
            text-shadow: 0 1px 2px #000;
        }

        #win-skip:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: none;
        }

        #replay-btn {
            display: none;
            background: #8e44ad;
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.4);
            margin-top: 14px;
        }

        #replay-btn:hover {
            background: #7d3c98;
        }

        #restart-btn {
            margin-top: 10px;
        }

        #level-display {
            color: #5dade2;
            line-height: 1.25;
        }

        .lv-name {
            color: #aed6f1;
            font-size: 11px;
            font-weight: normal;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            transition: all 0.2s;
        }

        button:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        .instructions {
            font-size: 14px;
            color: #bdc3c7;
            margin-top: 15px;
            line-height: 1.6;
        }

        /* ── Combo 閃字 ── */
        #combo-flash {
            position: absolute;
            top: 38%; left: 0; right: 0;
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            pointer-events: none;
            opacity: 0;
            z-index: 30;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }
        @keyframes comboPop {
            0%   { opacity: 1; transform: scale(1.4); }
            60%  { opacity: 1; transform: scale(1.0); }
            100% { opacity: 0; transform: scale(0.85) translateY(-18px); }
        }
        #combo-flash.pop { animation: comboPop 0.7s ease-out forwards; }

        /* ── 道具：剪刀 / 刮鬍刀 ── */
        .tool {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.5));
        }

        /* ── 金色鈔票 ── */
        .gold-bill {
            width: 68px; height: 29px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            filter: drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 12px #ff9900);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: bold; font-family: Arial, sans-serif;
            color: #ffe600; -webkit-text-stroke: 1px #8B6000;
            text-shadow: 0 0 4px #ffd700, 1px 1px 2px #000;
        }

        @keyframes toolShake {
            0%,100% { transform: rotate(-12deg) scale(1.1); }
            25%      { transform: rotate(12deg)  scale(1.2); }
            50%      { transform: rotate(-8deg)  scale(1.1); }
            75%      { transform: rotate(8deg)   scale(1.15); }
        }
        .tool { animation: toolShake 0.3s linear infinite; }

        /* ── 巨型藥盒 ── */
        .mega-pill {
            position: absolute;
            width: 320px;
            height: 140px;
            background-image: url('assets/pill.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 12;
            filter: drop-shadow(0 0 10px #e74c3c) drop-shadow(0 0 20px #c0392b);
        }
        @keyframes megaWarn {
            0%,100% { filter: drop-shadow(0 0 10px #e74c3c) drop-shadow(0 0 20px #c0392b); }
            50%      { filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 40px #ff6600) brightness(1.2); }
        }
        .mega-pill { animation: megaWarn 0.6s ease-in-out infinite; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- UI 資訊 -->
        <div id="ui">
            <div id="level-display">第 1 關<br><span class="lv-name">隨手給幾張</span></div>
            <div id="score-display">$0 / $300</div>
            <div id="hair-display">髮量 1/9</div>
            <div id="time-display">30s</div>
        </div>

        <!-- Combo 閃字 -->
        <div id="combo-flash"></div>

        <!-- 小鈔遮擋層 -->
        <div id="splash"></div>

        <!-- 爹地頭像 -->
        <div id="boss"></div>

        <!-- 遊戲碗/錢包 -->
        <div id="basket"></div>

        <!-- 開始畫面 -->
        <div id="start-screen">
            <h2 style="margin:0 0 2px">Who's Your Dad?</h2>
            <p style="margin:0 0 6px;color:#f1c40f;font-size:15px">接住爹地灑下來的小費</p>
            <p class="instructions">
                三個關卡，每關都要達到業績目標才能晉級<br>
                💵 $10 | 💵 $50 | 💵 $100<br>
                <span style="color: #ffeb3b; font-weight: bold;">⚠️ 接到「適尿通」扣 50，爹地頭髮 +1</span><br>
                <span style="color: #e67e22; font-weight: bold;">🔺 髮量整場累積，不會因為過關或重玩而還你</span><br>
                <span style="color: #e74c3c; font-weight: bold;">☠️ 髮量 9/9 還再吃一盒 → 直接結束</span>
            </p>
            <button id="start-btn">開始發小費</button>
        </div>

        <!-- 關卡畫面（開場／過關／失敗共用） -->
        <div id="level-screen">
            <h2 id="level-title">關卡一 · 試用期</h2>
            <p id="level-body" class="instructions"></p>
            <button id="level-btn">開工</button>
        </div>

        <!-- 三關全過的慶祝影片 -->
        <div id="win-video-wrap">
            <video id="win-video" playsinline muted preload="auto" src="assets/win.mp4"></video>
            <div id="win-caption">爹地：拿去用吧</div>
            <button id="win-play">▶ 播放</button>
            <button id="win-skip">跳過</button>
            <div id="win-status"></div>
        </div>

        <!-- 結束畫面 -->
        <div id="game-over-screen">
            <h2>遊戲結束！</h2>
            <p id="final-score" style="font-size: 24px; color: #f1c40f;"></p>
            <button id="replay-btn">🎬 看一次爹地的英姿</button>
            <button id="restart-btn">再挑戰一次</button>
        </div>
    </div>

    <script>
        const BOSS_FACES = [
            'assets/boss1.png',
            'assets/boss2.png',
            'assets/boss3.png',
            'assets/boss4.png',
            'assets/boss5.png',
            'assets/boss6.png',
            'assets/boss7.png',
            'assets/boss8.png',
            'assets/boss9.png'
        ];
        const BILLS = {
            '1': 'assets/bill1.png',
            '2': 'assets/bill2.png',
            '5': 'assets/bill5.png',
            '10': 'assets/bill10.png',
            '20': 'assets/bill20.png',
            '50': 'assets/bill50.png',
            '100': 'assets/bill100.png'
        };

        // ===== 關卡設定 =====
        const LEVELS = [
            { name: '關卡一 · 隨手給幾張', time: 28, target: 390,
              pill: 0.20, spawn: 290, bossMove: 300, speedBase: 3,
              drift: 0,   speedMul: 1.3, junk: false, gold: 0,    tool: 0.04,
              tip: '全部垂直落下，穩穩接就好' },
            { name: '關卡二 · 爹地心情好', time: 27, target: 910,
              pill: 0.32, spawn: 230, bossMove: 190, speedBase: 4,
              drift: 2.2, speedMul: 1.3, junk: false, gold: 0.04, tool: 0.05,
              tip: '連擊越高，藥盒越多越快，小心別斷' },
            { name: '關卡三 · 天女散花', time: 25, target: 1200,
              pill: 0.35, spawn: 200, bossMove: 180, speedBase: 4,
              drift: 2.6, speedMul: 1.35, junk: true, gold: 0.07, tool: 0.06,
              tip: '連擊拉越高，藥盒就越瘋，背水一戰' }
        ];
        // 播放結尾影片的關卡（最後一關）。測試時可暫時改成 0 = 第一關就播
        const WIN_AFTER_LEVEL = LEVELS.length - 1;


        const JUNK = [
            { bill: '1',  value: 1  },
            { bill: '2',  value: 2  },
            { bill: '5',  value: 5  },
            { bill: '20', value: 20 }
        ];

        const container    = document.getElementById('game-container');
        const basket       = document.getElementById('basket');
        const boss         = document.getElementById('boss');
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay  = document.getElementById('time-display');
        const hairDisplay  = document.getElementById('hair-display');
        const levelDisplay = document.getElementById('level-display');
        const startScreen  = document.getElementById('start-screen');
        const levelScreen  = document.getElementById('level-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn     = document.getElementById('start-btn');
        const levelBtn     = document.getElementById('level-btn');
        const restartBtn   = document.getElementById('restart-btn');
        const replayBtn    = document.getElementById('replay-btn');
        const finalScore   = document.getElementById('final-score');
        const levelTitle   = document.getElementById('level-title');
        const levelBody    = document.getElementById('level-body');
        const splash       = document.getElementById('splash');
        const winWrap      = document.getElementById('win-video-wrap');
        const winVideo     = document.getElementById('win-video');

        let levelIdx  = 0;     // 目前關卡 0~2
        let bank      = 0;     // 已過關累積的錢
        let score     = 0;     // 本關分數
        let hairLevel = 0;     // 0~8，整場累積、不隨關卡重置
        let overdose  = false;
        let timeLeft  = 0;
        let gameInterval, spawnInterval, bossInterval, splashTimer;
        let isPlaying = false;

        const containerWidth = 400;
        const basketWidth = 70;
        const bossWidth = 109;

        let combo = 0;
        function resetCombo() { combo = 0; }

        function addCombo() {
            combo += 1;
            if (combo >= 2) showComboFlash();
        }

        function showComboFlash() {
            const el = document.getElementById('combo-flash'); if (!el) return;
            const c = combo;
            const color = c >= 10 ? '#ff00ff'
                        : c >= 7  ? '#8e44ad'
                        : c >= 5  ? '#e74c3c'
                        : c >= 3  ? '#e67e22'
                        :           '#f1c40f';
            el.innerText = `× ${c} COMBO！`;
            el.style.color = color;
            el.classList.remove('pop');
            void el.offsetWidth;
            el.classList.add('pop');
        }

        // combo=0,1 → ×1；combo=2 → ×2；combo=3 → ×3 …無上限
        function comboMultiplier() { return combo >= 2 ? combo : 1; }

                function fmtMoney(v) { return (v < 0 ? '-$' : '$') + Math.abs(v); }

        function updateScore() {
            const lv = LEVELS[levelIdx];
            scoreDisplay.innerText = `${fmtMoney(score)} / $${lv.target}`;
            scoreDisplay.style.color = score < 0 ? '#e74c3c'
                                     : score >= lv.target ? '#2ecc71' : '';
        }

        function setHair(level) {
            hairLevel = level;
            boss.style.backgroundImage = `url('${BOSS_FACES[hairLevel]}')`;
            hairDisplay.innerText = `髮量 ${hairLevel + 1}/9`;
            hairDisplay.style.color = hairLevel >= 8 ? '#e74c3c'
                                    : hairLevel >= 6 ? '#e67e22' : '#f5b041';
        }

        // ===== 錢包移動 =====
        container.addEventListener('mousemove', (e) => {
            if (!isPlaying) return;
            const rect = container.getBoundingClientRect();
            moveBasket(e.clientX - rect.left - basketWidth / 2);
        });
        container.addEventListener('touchmove', (e) => {
            if (!isPlaying) return;
            const rect = container.getBoundingClientRect();
            moveBasket(e.touches[0].clientX - rect.left - basketWidth / 2);
            e.preventDefault();
        }, { passive: false });

        function moveBasket(x) {
            if (x < 0) x = 0;
            if (x > containerWidth - basketWidth) x = containerWidth - basketWidth;
            basket.style.left = x + 'px';
        }

        // ===== 關卡流程 =====
        function showLevelIntro() {
            const lv = LEVELS[levelIdx];
            levelTitle.innerText = lv.name;
            levelBody.innerHTML =
                `目標：<span style="color:#f1c40f">$${lv.target}</span>　限時 ${lv.time} 秒<br>` +
                `<span class="lv-tip">${lv.tip}</span><br>` +
                `目前髮量 <span style="color:#f5b041">${hairLevel + 1}/9</span>　` +
                `已存 <span style="color:#2ecc71">${fmtMoney(bank)}</span>`;
            levelBtn.innerText = '開工';
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            levelScreen.style.display = 'flex';
        }

        function startLevel() {
            if (isPlaying) return;     // 防止重複點擊疊加計時器
            stopLevel();               // 收掉任何殘留的 interval 與掉落物
            const lv = LEVELS[levelIdx];
            score = 0;                 // 沒過關重玩 → 本關分數歸零
            timeLeft = lv.time;
            isPlaying = true;
            overdose = false;
            resetCombo();
            megaCooldown = false;
            hideSplash();
            clearItems();
            setHair(hairLevel);        // 髮量沿用，不重置
            updateScore();
            const shortName = lv.name.split('·').pop().trim();
            levelDisplay.innerHTML =
                `第 ${levelIdx + 1} 關<br><span class="lv-name">${shortName}</span>`;
            timeDisplay.innerText = `${timeLeft}s`;
            levelScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';

            gameInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.innerText = `${timeLeft}s`;
                timeDisplay.style.color = timeLeft <= 5 ? '#e74c3c' : '';
                if (timeLeft <= 0) endLevel();
            }, 1000);

            bossInterval = setInterval(() => {
                if (!isPlaying) return;
                boss.style.left = Math.random() * (containerWidth - bossWidth) + 'px';
            }, lv.bossMove);

            spawnInterval = setInterval(spawnItem, lv.spawn);
        }

        function stopLevel() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            clearInterval(bossInterval);
            hideSplash();
            clearItems();
        }

        function clearItems() {
            container.querySelectorAll('.falling-item').forEach(el => el.remove());
        }

        // 時間到：判斷過關與否
        function endLevel() {
            stopLevel();
            const lv = LEVELS[levelIdx];
            if (score >= lv.target) {
                bank += score;
                if (levelIdx === WIN_AFTER_LEVEL) { playWinVideo(); return; }
                levelIdx++;
                levelTitle.innerText = '✅ 過關！';
                levelBody.innerHTML =
                    `這關賺了 <span style="color:#2ecc71">${fmtMoney(score)}</span>　` +
                    `累積 <span style="color:#2ecc71">${fmtMoney(bank)}</span><br>` +
                    `髮量 <span style="color:#f5b041">${hairLevel + 1}/9</span>　` +
                    `下一關：${LEVELS[levelIdx].name}`;
                levelBtn.innerText = '繼續';
                levelScreen.style.display = 'flex';
            } else {
                levelTitle.innerText = '❌ 爹地收手了';
                levelBody.innerHTML =
                    `只收到 <span style="color:#e74c3c">${fmtMoney(score)}</span>，` +
                    `差 <span style="color:#e74c3c">${fmtMoney(lv.target - score)}</span><br>` +
                    `<span class="lv-tip">本關分數歸零重來，但髮量不會還你</span><br>` +
                    `目前髮量 <span style="color:#f5b041">${hairLevel + 1}/9</span>`;
                levelBtn.innerText = '再來一次';
                levelScreen.style.display = 'flex';
            }
        }

        // 整場結束
        function finish(reason) {
            stopLevel();
            const h2 = gameOverScreen.querySelector('h2');
            const total = bank + (reason === 'clear' ? 0 : score);
            if (reason === 'overdose') {
                h2.innerText = '☠️ 適尿通過量！';
                finalScore.innerHTML =
                    `髮量爆表到 9/9 還硬吃一盒<br>` +
                    `倒在第 ${levelIdx + 1} 關，結算 ${fmtMoney(total)}`;
                finalScore.style.color = '#e74c3c';
            } else {
                const rank = hairLevel <= 2 ? '精算師 —— 錢賺了，頭髮也顧住了'
                           : hairLevel <= 5 ? '普通上班族 —— 有得有失'
                           : hairLevel <= 7 ? '拚命三郎 —— 這錢賺得有點傷'
                           : '以健康換錢 —— 爹地很滿意，你的頭皮不滿意';
                h2.innerText = '🎉 三關全過！';
                finalScore.innerHTML =
                    `總小費 <span style="color:#f1c40f">${fmtMoney(total)}</span><br>` +
                    `最終髮量 ${hairLevel + 1}/9<br>` +
                    `<span style="font-size:17px;color:#bdc3c7">${rank}</span>`;
                finalScore.style.color = '#f1c40f';
            }
            replayBtn.style.display = (reason === 'clear') ? 'block' : 'none';
            gameOverScreen.style.display = 'flex';
        }

        // ===== 三關全過的慶祝影片 =====
        const winPlayBtn = document.getElementById('win-play');
        const winSkipBtn = document.getElementById('win-skip');
        const winStatus  = document.getElementById('win-status');

        function playWinVideo(after) {
            let done = false;
            let watchdog = null;
            let log = '';

            const say = (msg, show) => {
                log += msg + '\n';
                if (show) winStatus.innerText = log;   // 只有出錯才顯示在畫面上
                console.log('[win-video]', msg);
            };

            // 只有「播完」「玩家按跳過」才會離開，其餘狀況一律留在畫面上
            const goNext = (why) => {
                if (done) return;
                done = true;
                clearTimeout(watchdog);
                try { winVideo.pause(); } catch (e) {}
                winWrap.style.display = 'none';
                winPlayBtn.style.display = 'none';
                winStatus.innerText = '';
                (after || (() => finish('clear')))();
            };

            const fail = (why) => {                 // 出錯：不跳過，顯示原因等玩家處理
                say('✖ ' + why, true);
                winPlayBtn.style.display = 'block';
                clearTimeout(watchdog);
            };

            const armWatchdog = () => {
                clearTimeout(watchdog);
                const dur = isFinite(winVideo.duration) && winVideo.duration > 0
                          ? winVideo.duration : 3;
                watchdog = setTimeout(() => goNext('逾時'), (dur + 3) * 1000);
            };

            winStatus.innerText = '';
            winWrap.style.display = 'flex';
            winPlayBtn.style.display = 'none';
            winWrap.onclick = null;
            winSkipBtn.onclick = (e) => { e.stopPropagation(); goNext('跳過'); };
            winPlayBtn.onclick = (e) => {
                e.stopPropagation();
                winPlayBtn.style.display = 'none';
                say('手動播放…');
                winVideo.play().then(() => { say('✔ 播放中'); armWatchdog(); })
                               .catch((er) => fail('手動播放失敗 ' + (er && er.name)));
            };

            winVideo.onended = () => goNext('播完');
            winVideo.onerror = () => {
                const c = winVideo.error ? winVideo.error.code : '?';
                fail('影片載入錯誤 code=' + c);
            };
            winVideo.onstalled = () => say('· stalled');
            winVideo.onloadeddata = () => say('· loadeddata ok');

            winVideo.muted = true;
            winVideo.playsInline = true;
            winVideo.controls = false;


            const start = () => {
                if (done) return;
                say('· readyState=' + winVideo.readyState);
                try { winVideo.currentTime = 0; } catch (e) {}
                const pr = winVideo.play();
                if (pr && pr.then) {
                    pr.then(() => { say('✔ 自動播放成功'); armWatchdog(); })
                      .catch((e) => {
                          say('自動播放被拒 ' + (e && e.name) + '，請按播放');
                          winPlayBtn.style.display = 'block';
                      });
                } else { armWatchdog(); }
            };

            if (winVideo.readyState >= 2) {
                start();
            } else {
                winVideo.addEventListener('loadeddata', start, { once: true });
                winVideo.load();
                setTimeout(() => {
                    if (!done && winVideo.paused && winPlayBtn.style.display === 'none') {
                        say('· 1.5s 後仍未就緒，強制嘗試');
                        start();
                    }
                }, 1500);
            }
        }

        // ===== 小鈔遮擋 =====
        function showSplash() {
            splash.style.opacity = '1';
            clearTimeout(splashTimer);
            splashTimer = setTimeout(hideSplash, 900);
        }
        function hideSplash() {
            clearTimeout(splashTimer);
            splash.style.opacity = '0';
        }

        // ===== 掉落物 =====

        // ── 巨型藥盒（橫掃式）──
        let megaCooldown = false;   // 同時只允許一顆

        function spawnMegaPill() {
            if (!isPlaying || megaCooldown) return;
            megaCooldown = true;

            const lv     = LEVELS[levelIdx];
            const pw     = 320;                    // 藥盒寬度
            // 隨機水平位置：左邊最多從 0 開始，右邊最多讓右緣貼齊容器
            const startX = Math.random() * (containerWidth - pw);
            let topPos   = 120;  // 從爹地正下方開始往下掉
            // 速度比一般藥盒慢（壓迫感，但還有機會閃）
            const speed  = lv.speedBase * lv.speedMul * 0.65;
            // 左右搖擺幅度依關卡設定（與一般掉落物一致）
            let megaX   = startX;
            let megaDrift = lv.drift > 0
                ? (Math.random() < 0.5 ? -1 : 1) * lv.drift * 0.8
                : 0;

            const item = document.createElement('div');
            item.classList.add('mega-pill');
            item.style.top  = topPos + 'px';
            item.style.left = megaX + 'px';
            container.appendChild(item);

            function sweep() {
                if (!isPlaying) { item.remove(); megaCooldown = false; return; }
                topPos += speed;
                item.style.top = topPos + 'px';
                // 左右搖擺，碰牆反彈
                if (megaDrift !== 0) {
                    megaX += megaDrift;
                    if (megaX < 0) { megaX = 0; megaDrift = -megaDrift; }
                    else if (megaX + pw > containerWidth) { megaX = containerWidth - pw; megaDrift = -megaDrift; }
                    item.style.left = megaX + 'px';
                }

                // 碰撞偵測
                const b = basket.getBoundingClientRect();
                const r = item.getBoundingClientRect();
                if (r.bottom >= b.top && r.top <= b.bottom &&
                    r.right  >= b.left && r.left <= b.right) {
                    // 命中：扣分 + combo歸零 + 髮量 +2
                    score -= 50;
                    resetCombo();
                    const newHair = Math.min(hairLevel + 2, 8);
                    if (hairLevel >= 8) {
                        // 髮量已是 9/9 → 直接過量
                        overdose = true;
                        updateScore();
                        item.remove();
                        megaCooldown = false;
                        finish('overdose');
                        return;
                    }
                    setHair(newHair);
                    if (newHair >= 8) {
                        // 剛好升到 9/9，下一顆普通藥盒就死
                    }
                    updateScore();
                    item.remove();
                    // 命中後冷卻 4 秒
                    setTimeout(() => { megaCooldown = false; }, 4000);
                    return;
                }

                // 離開畫面（底部）
                if (topPos > 620) {
                    item.remove();
                    setTimeout(() => { megaCooldown = false; }, 1500);
                    return;
                }
                requestAnimationFrame(sweep);
            }
            requestAnimationFrame(sweep);
        }

        function spawnItem() {
            if (!isPlaying) return;
            // 巨型藥盒：分數達到當關目標 50% 後，每次生成有 8% 機率橫掃
            if (!megaCooldown && score >= LEVELS[levelIdx].target * 0.5
                && Math.random() < 0.08) {
                spawnMegaPill(); return;
            }

            const lv = LEVELS[levelIdx];
            const item = document.createElement('div');
            item.classList.add('falling-item');

            const rand = Math.random();
            let type, value = 0;
            let speed = (Math.random() * 3 + lv.speedBase) * lv.speedMul;

            // 機率累加：藥盒 → 道具 → 金色鈔票 → 干擾小鈔 → 一般鈔票
            // 藥盒機率和速度隨連擊等比增加
            const comboPillMul = 1 + combo * 0.08;
            const comboPillSpd = combo * 0.3;
            const p_pill = Math.min(lv.pill * comboPillMul, 0.65);  // 最高 65%
            const p_tool = p_pill + lv.tool;
            const p_gold = p_tool + lv.gold;
            const p_junk = p_gold + (lv.junk ? 0.25 : 0);

            if (rand < p_pill) {
                item.classList.add('pill-box');
                type = 'pill';
                speed += 1 + comboPillSpd;

            } else if (rand < p_tool) {
                // 剪刀 or 刮鬍刀（各 50%）
                const isSci = Math.random() < 0.5;
                item.classList.add('tool');
                item.innerText = isSci ? '✂️' : '🪒';
                type = 'tool';
                speed += 6;     // 非常快，比金鈔還快1格，要刻意搶

            } else if (rand < p_gold) {
                // 金色鈔票 $500
                item.classList.add('gold-bill');
                item.style.backgroundImage = `url('${BILLS['100']}')`;
                item.innerText = '💰$500';
                type = 'gold';
                value = 500;
                speed += 5;     // 快

            } else if (lv.junk && rand < p_junk) {
                const j = JUNK[Math.floor(Math.random() * JUNK.length)];
                item.classList.add('bill');
                item.style.backgroundImage = `url('${BILLS[j.bill]}')`;
                item.innerText = '$' + j.bill;
                type = 'junk';
                value = j.value;

            } else {
                const r2 = (rand - p_junk) / (1 - p_junk) || Math.random();
                let amt;
                if (r2 < 0.55)      { amt = '10';  }
                else if (r2 < 0.85) { amt = '50';  speed += 1; }
                else                { amt = '100'; speed += 3; }
                item.classList.add('bill');
                item.style.backgroundImage = `url('${BILLS[amt]}')`;
                item.innerText = '$' + amt;
                type = amt;
                value = parseInt(amt, 10);
            }

            const bossLeft = parseFloat(boss.style.left) || 170;
            item.style.left = (bossLeft + bossWidth / 2 - 15) + 'px';
            item.style.top = '125px';
            container.appendChild(item);

            let topPos = 125;
            // 斜線：關卡一為 0（垂直），二、三所有掉落物都會斜著走
            let drift = 0;
            if (lv.drift > 0) {
                // 避開接近垂直的角度，斜線才看得出來
                const dir = Math.random() < 0.5 ? -1 : 1;
                drift = dir * (lv.drift * (0.45 + Math.random() * 0.55));
            }
            let x = parseFloat(item.style.left);

            function fall() {
                if (!isPlaying) { item.remove(); return; }
                topPos += speed;
                item.style.top = topPos + 'px';
                if (drift) {
                    x += drift;
                    const w = item.offsetWidth || 68;
                    if (x < 0) { x = 0; drift = -drift; }               // 撞左牆反彈
                    else if (x > containerWidth - w) { x = containerWidth - w; drift = -drift; }
                    item.style.left = x + 'px';
                }

                const b = basket.getBoundingClientRect();
                const r = item.getBoundingClientRect();
                if (r.bottom >= b.top && r.top <= b.bottom &&
                    r.right >= b.left && r.left <= b.right) {
                    if (type === 'pill') {
                        score -= 50;
                        resetCombo();
                        if (hairLevel >= 8) {
                            overdose = true;
                            updateScore();
                            item.remove();
                            finish('overdose');
                            return;
                        }
                        setHair(hairLevel + 1);

                    } else if (type === 'tool') {
                        // 剪刀 / 刮鬍刀：髮量 -1（最低 0）
                        if (hairLevel > 0) setHair(hairLevel - 1);
                        // 道具不加分、不算連擊、不中斷連擊

                    } else if (type === 'gold') {
                        const mul = comboMultiplier();
                        score += value * mul;
                        addCombo();

                    } else if (type === 'junk') {
                        score += value;
                        resetCombo();   // 小鈔中斷連擊
                        showSplash();

                    } else {
                        // 一般鈔票
                        const mul = comboMultiplier();
                        score += value * mul;
                        addCombo();
                    }
                    updateScore();
                    item.remove();
                    return;
                }

                if (topPos > 600) { if (type !== 'pill' && type !== 'tool') resetCombo(); item.remove(); }
                else requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        // ===== 按鈕 =====
        function newGame() {
            levelIdx = 0; bank = 0; score = 0; hairLevel = 0; overdose = false;
            showLevelIntro();
        }
        startBtn.addEventListener('click', newGame);
        restartBtn.addEventListener('click', newGame);
        replayBtn.addEventListener('click', () => {
            gameOverScreen.style.display = 'none';
            playWinVideo(() => { gameOverScreen.style.display = 'flex'; });
        });
        levelBtn.addEventListener('click', startLevel);
    </script>
</body>
</html>
